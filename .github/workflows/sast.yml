name: SAST

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No AWS credentials — static scans only.
# Working-tree scanners only — no git history needed (shallow checkout).
permissions:
  contents: read

jobs:
  sast:
    name: SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: semgrep
        run: |
          pip install semgrep==1.166.0
          semgrep --config p/python \
                  --config p/owasp-top-ten \
                  --config p/typescript \
                  --config p/react \
                  --error .

      - name: ruff
        if: hashFiles('**/*.py') != ''
        run: |
          pip install ruff==0.15.17
          ruff check .
