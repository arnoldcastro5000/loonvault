name: Secrets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No AWS credentials — static scans only.
# History scanners — need full git history (fetch-depth: 0).
permissions:
  contents: read

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # secret scanners walk every commit
          persist-credentials: false

      - name: gitleaks
        run: |
          curl -sSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          tar xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm gitleaks.tar.gz
          gitleaks git --config .gitleaks.toml --redact .

      - name: betterleaks
        run: |
          curl -sSLo betterleaks.tar.gz \
            "https://github.com/betterleaks/betterleaks/releases/download/v1.5.0/betterleaks_1.5.0_linux_x64.tar.gz"
          tar xzf betterleaks.tar.gz -C /usr/local/bin betterleaks
          rm betterleaks.tar.gz
          betterleaks git .

      - name: trufflehog (verified credentials)
        uses: trufflesecurity/trufflehog@d411fff7b8879a62509f3fa98c07f247ac089a51 # v3.95.5
        with:
          extra_args: --only-verified

      - name: trufflehog (AWS account ID)
        uses: trufflesecurity/trufflehog@d411fff7b8879a62509f3fa98c07f247ac089a51 # v3.95.5
        with:
          extra_args: --config .trufflehog.yml
