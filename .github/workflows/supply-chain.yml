name: Supply chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No AWS credentials — static scans only.
permissions:
  contents: read

jobs:
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: pip-audit
        if: hashFiles('**/requirements*.txt', '**/requirements*.lock', '**/pyproject.toml') != ''
        shell: bash
        run: |
          pip install pip-audit==2.10.1
          # NOTE: `find ... -exec pip-audit ...` returns find's exit code, not pip-audit's,
          # so a CVE never failed this job. Accumulate status explicitly and exit non-zero
          # if any file has a vulnerability.
          status=0
          # Audit the hash-pinned lockfiles first: they are the full transitive closure that
          # actually gets deployed (loonvault-build installs from these with --require-hashes).
          # --no-deps audits the pinned set as-is, without re-resolving.
          while IFS= read -r -d '' lock; do
            echo "::group::pip-audit (lock) $lock"
            pip-audit --no-deps -r "$lock" || status=1
            echo "::endgroup::"
          done < <(find . -name 'requirements*.lock' -not -path '*/.venv/*' -print0)
          # Audit any requirements.txt that has no sibling lockfile (direct deps only).
          while IFS= read -r -d '' req; do
            [ -f "${req%.txt}.lock" ] && continue
            echo "::group::pip-audit (req) $req"
            pip-audit -r "$req" || status=1
            echo "::endgroup::"
          done < <(find . -name 'requirements*.txt' -not -path '*/.venv/*' -print0)
          exit "$status"

      - name: npm audit
        if: hashFiles('frontend/package.json') != ''
        run: cd frontend && npm ci && npm audit --audit-level=high

      - name: socket
        if: hashFiles('frontend/package.json') != ''
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          api-key: ${{ secrets.SOCKET_SECURITY_API_KEY }}
