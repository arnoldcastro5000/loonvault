name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No AWS credentials — static scans only. Minimal permissions throughout.
permissions:
  contents: read

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.9"

      - name: fmt check
        run: terraform fmt -recursive -check infra/

      - name: validate
        run: |
          cd infra/bootstrap && terraform init -backend=false && terraform validate
          cd ../org && terraform init -backend=false && terraform validate
          cd ../loonvault && terraform init -backend=false && terraform validate

      - name: tflint
        run: |
          curl -sSLo tflint.zip \
            "https://github.com/terraform-linters/tflint/releases/download/v0.63.1/tflint_linux_amd64.zip"
          unzip -q tflint.zip -d /usr/local/bin
          rm tflint.zip
          tflint --init
          tflint --recursive

      - name: checkov
        run: |
          pip install checkov
          checkov -d infra/ --framework terraform --quiet

  sast:
    name: SAST and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # gitleaks needs full history to scan all commits
          persist-credentials: false

      - name: semgrep
        run: |
          pip install semgrep
          semgrep --config p/python \
                  --config p/owasp-top-ten \
                  --config p/typescript \
                  --config p/react \
                  --error .

      - name: gitleaks
        run: |
          curl -sSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          tar xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm gitleaks.tar.gz
          gitleaks git --config .gitleaks.toml --redact .

      - name: betterleaks
        run: |
          curl -sSLo betterleaks.tar.gz \
            "https://github.com/betterleaks/betterleaks/releases/download/v1.5.0/betterleaks_1.5.0_linux_x64.tar.gz"
          tar xzf betterleaks.tar.gz -C /usr/local/bin betterleaks
          rm betterleaks.tar.gz
          betterleaks .

      - name: trufflehog (verified credentials)
        uses: trufflesecurity/trufflehog@d411fff7b8879a62509f3fa98c07f247ac089a51 # v3.95.5
        with:
          extra_args: --only-verified

      - name: trufflehog (AWS account ID)
        uses: trufflesecurity/trufflehog@d411fff7b8879a62509f3fa98c07f247ac089a51 # v3.95.5
        with:
          extra_args: --config .trufflehog.yml

      - name: ruff
        if: hashFiles('**/*.py') != ''
        run: |
          pip install ruff
          ruff check .

  lint:
    name: Lint and workflow security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: just --fmt --check
        run: |
          curl -sSLo just.tar.gz \
            "https://github.com/casey/just/releases/download/1.52.0/just-1.52.0-x86_64-unknown-linux-musl.tar.gz"
          tar xzf just.tar.gz -C /usr/local/bin just
          rm just.tar.gz
          just --fmt --check --unstable

      - name: zizmor
        run: |
          pip install zizmor
          zizmor .github/workflows/

      - name: actionlint
        run: |
          curl -sSLo actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          tar xzf actionlint.tar.gz -C /usr/local/bin actionlint
          rm actionlint.tar.gz
          actionlint

      - name: regal
        if: hashFiles('**/*.rego') != ''
        run: |
          curl -sSLo /usr/local/bin/regal \
            "https://github.com/StyraInc/regal/releases/download/v0.41.1/regal_Linux_x86_64"
          chmod +x /usr/local/bin/regal
          regal lint .

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: pip-audit
        if: hashFiles('**/requirements*.txt', '**/pyproject.toml') != ''
        run: |
          pip install pip-audit
          find . -name 'requirements*.txt' -not -path '*/.venv/*' \
            -exec pip-audit -r {} \;

      - name: npm audit
        if: hashFiles('frontend/package.json') != ''
        run: cd frontend && npm ci && npm audit --audit-level=high

      - name: socket
        if: hashFiles('frontend/package.json') != ''
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          api-key: ${{ secrets.SOCKET_SECURITY_API_KEY }}

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  docs-drift:
    name: Docs drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: verify-docs
        run: bash scripts/verify-docs.sh
