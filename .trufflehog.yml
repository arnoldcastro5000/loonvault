detectors:
  - name: AWSAccountIDinARN
    keywords:
      - "arn:aws:"
    regex:
      account_id: 'arn:aws:[a-z0-9\-]*:[a-z0-9\-]*:(\d{12})[:/]'

  - name: AWSAccountIDinResourceName
    keywords:
      - bucket
      - table
      - queue
      - function
      - cluster
    regex:
      account_id: '(?i)(?:bucket|table|queue|function|cluster)\s*=\s*"[a-z0-9\-]+-(\d{12})["-]'

  - name: AWSAccountIDinSQSURL
    keywords:
      - "sqs."
      - "amazonaws.com"
    regex:
      account_id: 'https://sqs\.[a-z0-9\-]+\.amazonaws\.com/(\d{12})/'

  - name: AWSAccountIDinVariable
    keywords:
      - account_id
      - accountid
      - aws_account
      - accountId
    regex:
      account_id: "(?i)(?:account[_\\-]?id|aws[_\\-]?account)\\s*[:=]\\s*[\"']?(\\d{12})[\"']?"

  - name: AWSAccountIDinECR
    keywords:
      - "dkr.ecr"
    regex:
      account_id: '(\d{12})\.dkr\.ecr\.[a-z0-9\-]+\.amazonaws\.com'

  - name: AWSAccountIDinIAMPrincipal
    keywords:
      - '"AWS"'
    regex:
      account_id: '"AWS"\s*:\s*\[?\s*"(\d{12})"'

  - name: AWSAccountIDinConsoleURL
    keywords:
      - "accountId="
    regex:
      account_id: '[?&#]accountId=(\d{12})'

  - name: AWSAccountIDinArrayElement
    keywords:
      - '"AWS"'
    regex:
      account_id: ',\s*"(\d{12})"'

  # Catch-all for the bare/prose form. trufflehog requires a keyword prefilter, so this
  # is gated on "account"; gitleaks' aws-account-id-bare rule covers keyword-less forms.
  - name: AWSAccountIDBare
    keywords:
      - account
    regex:
      account_id: '(?i)account[^\n]{0,40}?\b(\d{12})\b'
