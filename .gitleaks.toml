[extend]
useDefault = true

[allowlist]
description = "Accepted: AWS account IDs were published in efd84b9 (PR #22) before being classified non-public. An account ID cannot be rotated, so a leak with no rotation path is recorded here as an accepted exception rather than rewriting public history. New occurrences are still caught by aws-account-id-bare."
commits = ["efd84b9e1127c200cb33b503d89788be74b9b996"]

[[rules]]
id = "aws-account-id-arn"
description = "AWS account ID embedded in ARN"
regex = '''arn:aws:[a-z0-9\-]*:[a-z0-9\-]*:(\d{12})[:/]'''
secretGroup = 1

[[rules]]
id = "aws-account-id-resource"
description = "AWS account ID embedded in resource name"
regex = '''(?i)(?:bucket|table|queue|function|cluster)\s*=\s*"[a-z0-9\-]+-(\d{12})["-]'''
secretGroup = 1

[[rules]]
id = "aws-account-id-sqs-url"
description = "AWS account ID in SQS queue URL"
regex = '''https://sqs\.[a-z0-9\-]+\.amazonaws\.com/(\d{12})/'''
secretGroup = 1

[[rules]]
id = "aws-account-id-variable"
description = "AWS account ID in standalone variable assignment"
regex = '''(?i)(?:account[_\-]?id|aws[_\-]?account)\s*[:=]\s*["']?(\d{12})["']?'''
secretGroup = 1

[[rules]]
id = "aws-account-id-ecr"
description = "AWS account ID in ECR registry URL"
regex = '''(\d{12})\.dkr\.ecr\.[a-z0-9\-]+\.amazonaws\.com'''
secretGroup = 1

[[rules]]
id = "aws-account-id-iam-principal"
description = "AWS account ID as bare IAM Principal (scalar or array element)"
regex = '''"AWS"\s*:\s*\[?\s*"(\d{12})"'''
secretGroup = 1

[[rules]]
id = "aws-account-id-console-url"
description = "AWS account ID in console deep-link URL"
regex = '''[?&#]accountId=(\d{12})'''
secretGroup = 1

[[rules]]
id = "aws-account-id-array-element"
description = "AWS account ID as a bare quoted array element (following a comma)"
regex = ''',\s*"(\d{12})"'''
secretGroup = 1

# Catch-all: any bare 12-digit token. AWS account IDs are treated as non-public
# (threat model §3). Generic by design — no account ID is hardcoded here. The only
# 12-digit tokens that legitimately appear in this repo are account IDs; if a genuine
# non-account 12-digit number is ever needed, allowlist that specific instance.
[[rules]]
id = "aws-account-id-bare"
description = "Bare 12-digit AWS account ID (any context, incl. prose)"
regex = '''\b(\d{12})\b'''
secretGroup = 1
